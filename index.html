<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎂 有一个礼物等你拆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(160deg, #0f0c29 0%, #302b63 55%, #24243e 100%);
    color: #f5f0ff;
    overflow-x: hidden;
    min-height: 100vh;
  }
  .star {
    position: fixed; border-radius: 50%; background: #fff;
    animation: twinkle var(--d) ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
  main {
    max-width: 560px; margin: 0 auto; padding: 48px 24px 64px;
    min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
  }
  .box { font-size: 84px; cursor: pointer; user-select: none;
    animation: bounce 1.6s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  .hint { margin-top: 28px; font-size: 17px; letter-spacing: 2px; opacity: .85; }
  h1 { font-size: 30px; margin-bottom: 24px; letter-spacing: 3px; }
  video {
    width: 100%; border-radius: 16px; box-shadow: 0 12px 48px rgba(0,0,0,.5);
    background: #000; outline: none;
  }
  #message { margin: 28px 0 8px; font-size: 16px; line-height: 2; opacity: .92; white-space: pre-line; }
  #footer { margin-top: 32px; font-size: 14px; opacity: .55; letter-spacing: 1px; }
</style>
</head>
<body>
<main>
  <section id="cover">
    <div class="box" onclick="openGift()">🎁</div>
    <p class="hint">点一下，拆开你的礼物</p>
  </section>
  <section id="gift" hidden>
    <h1 id="greeting"></h1>
    <video id="video" controls playsinline preload="metadata"></video>
    <div id="message"></div>
    <p id="footer"></p>
  </section>
</main>
<script>
/* =====================================================
   以后想改内容，只需要修改下面 CONFIG 里的文字。
   想换视频：把仓库里的 video.mp4 换成新文件（同名就不用改这）。
   想改成"跳转到别的网页"：把 CONFIG 整个删掉，换成一行
     location.replace("https://新网址");
   ===================================================== */
const CONFIG = {
  name: "亲爱的小朋友",
  title: "生日快乐！",
  lines: [
    "第一句话写在这里。",
    "第二句话写在这里。",
    "视频下面可以一直往下加句子。",
  ],
  video: "video.mp4",
  footer: "—— 永远爱你的我",
};

// 星星背景
for (let i = 0; i < 70; i++) {
  const s = document.createElement("span");
  s.className = "star";
  const size = Math.random() * 2.2 + 0.6;
  s.style.cssText = `left:${Math.random()*100}vw;top:${Math.random()*100}vh;` +
    `width:${size}px;height:${size}px;--d:${(Math.random()*3+1.5).toFixed(1)}s;` +
    `animation-delay:${(Math.random()*3).toFixed(1)}s;`;
  document.body.appendChild(s);
}

function openGift() {
  document.getElementById("cover").hidden = true;
  const gift = document.getElementById("gift");
  gift.hidden = false;
  document.getElementById("greeting").textContent =
    CONFIG.name + "，" + CONFIG.title;
  const v = document.getElementById("video");
  v.src = CONFIG.video;
  document.getElementById("message").textContent = CONFIG.lines.join("\n");
  document.getElementById("footer").textContent = CONFIG.footer;
  window.scrollTo(0, 0);
}
</script>
</body>
</html>
