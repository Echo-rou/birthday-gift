<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎂 有一个礼物等你拆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-snap-type: y proximity; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(160deg, #0f0c29 0%, #302b63 55%, #24243e 100%);
    color: #f5f0ff;
    overflow-x: hidden;
    min-height: 100vh;
  }
  .star {
    position: fixed; border-radius: 50%; background: #fff;
    animation: twinkle var(--d) ease-in-out infinite;
    pointer-events: none; z-index: 0;
  }
  @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; }

  /* ============ 封面：拆礼物 ============ */
  #cover {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
  }
  .box { font-size: 84px; cursor: pointer; user-select: none;
    animation: bounce 1.6s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  .hint { margin-top: 28px; font-size: 17px; letter-spacing: 2px; opacity: .85; }

  /* ============ 故事流：每一环占满一屏，上下滑自由穿行 ============ */
  #story[hidden] { display: none; }
  .vblock {
    position: relative; width: 100%;
    height: 100vh; height: 100dvh;
    scroll-snap-align: start; scroll-snap-stop: always;
    overflow: hidden; display: flex;
    flex-direction: column; justify-content: center; align-items: center;
    text-align: center;
  }
  .vinner { max-width: 560px; width: 100%; padding: 0 24px; position: relative; z-index: 2; }

  #opening { background: #000; }
  #opening .bo-text { font-size: 14px; letter-spacing: 6px; color: rgba(255,255,255,.8); }
  #opening .bo-sub { margin-top: 18px; font-size: 12px; letter-spacing: 3px; color: rgba(255,255,255,.35); }

  #greetcard {
    background:
      radial-gradient(circle at 20% 15%, rgba(255,209,102,.10), transparent 45%),
      linear-gradient(160deg, #171340 0%, #302b63 55%, #24243e 100%);
  }
  h1 { font-size: 30px; letter-spacing: 3px; line-height: 1.5; }
  .subtitle { margin-top: 16px; font-size: 15px; opacity: .65; letter-spacing: 2px; line-height: 1.9; }
  .cuedown { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,.45); animation: cueup 2s ease-in-out infinite; }
  @keyframes cueup { 0%,100% { transform: translate(-50%,0); opacity:.45 } 50% { transform: translate(-50%,-8px); opacity:.9 } }

  .vphoto { background: #000; }
  .vphoto img.bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0; transition: opacity 1.2s ease;
  }
  .vphoto.inview img.bg { opacity: 1; animation: kenburns 12s ease-out forwards; }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.1); } }
  .vphoto.nophoto img.bg { display: none; }
  .vphoto.nophoto {
    background:
      radial-gradient(circle at 78% 18%, rgba(255,209,102,.14), transparent 42%),
      linear-gradient(155deg, #3a2f63 0%, #232a4d 55%, #1a2238 100%);
  }
  .cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 96px 24px 84px; text-align: left;
    background: linear-gradient(180deg, transparent 0%, rgba(8,6,20,.55) 55%, rgba(8,6,20,.9) 100%);
    animation: floaty 5s ease-in-out infinite;
  }
  .cap .capin { max-width: 560px; margin: 0 auto; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .m-date {
    display: inline-block; font-size: 12px; letter-spacing: 3px;
    color: #ffd166; border: 1px solid rgba(255,209,102,.5);
    border-radius: 999px; padding: 4px 14px; margin-bottom: 12px;
    text-shadow: 0 1px 8px rgba(0,0,0,.6);
  }
  .m-title { font-size: 26px; font-weight: 600; letter-spacing: 2px; margin-bottom: 10px;
    text-shadow: 0 2px 14px rgba(0,0,0,.75); }
  .m-text { font-size: 15px; line-height: 1.9; opacity: .92; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  .vphoto.inview .m-date  { animation: rise .9s .15s ease both; }
  .vphoto.inview .m-title { animation: rise .9s .35s ease both; }
  .vphoto.inview .m-text  { animation: rise .9s .55s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }

  #videoblock {
    background:
      radial-gradient(circle at 80% 80%, rgba(255,209,102,.10), transparent 45%),
      linear-gradient(160deg, #171340 0%, #302b63 55%, #24243e 100%);
  }
  h2 {
    font-size: 15px; letter-spacing: 6px; opacity: .6; font-weight: normal;
    margin-bottom: 26px; text-align: center;
  }
  h2::before { content: "· · · "; opacity: .5; }
  h2::after { content: " · · ·"; opacity: .5; }
  video {
    width: 100%; border-radius: 16px; box-shadow: 0 12px 48px rgba(0,0,0,.5);
    background: #000; outline: none;
  }

  #letterwrap { padding: 80px 24px 90px; }
  #letterwrap .letter {
    max-width: 560px; margin: 0 auto;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px; padding: 28px 22px; text-align: left;
    font-size: 16px; line-height: 2.1; white-space: pre-line; opacity: .95;
  }
  .sign { margin-top: 18px; text-align: right; font-size: 14px; opacity: .6; }
  #footer { max-width: 560px; margin: 48px auto 0; font-size: 13px; opacity: .5; letter-spacing: 1px; line-height: 2; }

  /* ============ 开场视频全屏覆盖层 ============ */
  #videowrap {
    position: fixed; inset: 0; z-index: 80; background: #000;
    user-select: none; -webkit-user-select: none;
  }
  #videowrap[hidden] { display: none; }
  #openingVideo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000;
  }
  #videoSkip {
    position: absolute; top: 16px; right: 16px;
    font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,.8);
    background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
    backdrop-filter: blur(4px); z-index: 2;
  }
  #replay {
    position: fixed; top: 16px; left: 16px; z-index: 85;
    font-size: 12px; letter-spacing: 2px; color: #ffd166;
    background: rgba(0,0,0,.4); border: 1px solid rgba(255,209,102,.45);
    border-radius: 999px; padding: 7px 16px; cursor: pointer;
    backdrop-filter: blur(4px);
  }
</style>
</head>
<body>

<div id="cover">
  <div class="box" onclick="openGift()">🎁</div>
  <p class="hint">点一下，拆开你的礼物</p>
</div>

<div id="story" hidden>
  <section class="vblock" id="opening">
    <div class="vinner">
      <div class="bo-text">别急 · 我们把时光慢慢放一遍</div>
      <div class="bo-sub">往下滑，进入回忆</div>
    </div>
  </section>

  <section class="vblock" id="greetcard">
    <div class="vinner">
      <h1 id="greeting"></h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="cuedown">↓ 继续下滑</div>
  </section>

  <!-- 照片卡由 CONFIG.memories 注入到这里 -->

  <section class="vblock" id="videoblock">
    <div class="vinner">
      <h2 id="video-heading">今 年 的 这 一 章</h2>
      <video id="video" controls playsinline preload="metadata"></video>
    </div>
  </section>

  <section id="letterwrap">
    <h2>一 封 信</h2>
    <div class="letter"><span id="letter"></span><div class="sign" id="sign"></div></div>
    <p id="footer"></p>
  </section>
</div>

<div id="videowrap" hidden>
  <video id="openingVideo" src="opening.mp4" playsinline preload="auto"></video>
  <button id="videoSkip" onclick="event.stopPropagation();skipOpening()">跳过 ↓</button>
</div>

<canvas id="confetti"></canvas>
<button id="replay" hidden onclick="replay()">↺ 再看一遍</button>

<script>
/* =====================================================================
   开场：🎁 点开 → 全屏播放剪映剪好的卡点视频（opening.mp4）
         → 放完自动熄屏 → 进入可上下滑的故事流（照片+文字飘浮）
   想改内容只动 CONFIG：
   · memories：一屏一张照片 + 你的话。photo 填 "photos/1.jpg"，
     照片传到本仓库 photos/ 文件夹；没照片先留 ""。
   · video：故事中段「今年的这一章」的小视频。
   · 想让网页跳转别的网址：把 CONFIG 整段换成
       location.replace("https://新网址");
   ===================================================================== */
const CONFIG = {
  name: "亲爱的姐姐",
  title: "三十岁生日快乐！",
  subtitle: "三十而已，未来可期",
  openingVideo: "opening.mp4",   // 剪映导出的开场卡点视频
  memories: [
    { photo: "", date: "1996", title: "她来啦", text: "出生那年的小故事写在这里——第一次见到这个小家伙的人，都说她将来一定不得了。" },
    { photo: "", date: "年份", title: "小小少年", text: "童年的一张照片配一句话：那时候的她，最爱做的事情是什么？" },
    { photo: "", date: "年份", title: "学生时代", text: "校服、课桌、和好朋友们。挑一张那时候的照片放进来。" },
    { photo: "", date: "年份", title: "长大成人", text: "工作、远方、她一个人扛过的那些事。" },
    { photo: "", date: "这几年", title: "我们的合照", text: "挑一张你们俩的合影，写一句只有你们懂的话。" },
    { photo: "", date: "三十岁", title: "新的开始", text: "最后一张照片，写给三十岁的她：往后都是坦途，生日快乐。" },
  ],
  videoHeading: "今 年 的 这 一 章",
  video: "video.mp4",
  letter: [
    "信的第一段写在这里，可以写很多行。",
    "第二段写在这里。",
  ].join("\n"),
  sign: "—— 永远爱你的弟弟",
  footer: "这个网址每年都会更新新的故事\n这张卡片，永远不会过期",
};

/* ---------- 页面逻辑 ---------- */
for (let i = 0; i < 70; i++) {
  const s = document.createElement("span");
  s.className = "star";
  const size = Math.random() * 2.2 + 0.6;
  s.style.cssText = `left:${Math.random()*100}vw;top:${Math.random()*100}vh;` +
    `width:${size}px;height:${size}px;--d:${(Math.random()*3+1.5).toFixed(1)}s;` +
    `animation-delay:${(Math.random()*3).toFixed(1)}s;`;
  document.body.appendChild(s);
}

function openGift() {
  document.getElementById("cover").style.display = "none";
  const story = document.getElementById("story");
  story.hidden = false;
  buildStory();
  window.scrollTo(0, 0);
  document.getElementById("replay").hidden = false;
  confetti();
  playOpening();
}

function buildStory() {
  document.getElementById("greeting").textContent = CONFIG.name + "，" + CONFIG.title;
  document.getElementById("subtitle").innerHTML = CONFIG.subtitle.replace(/\n/g, "<br>");
  document.getElementById("video").src = CONFIG.video;
  document.getElementById("letter").textContent = CONFIG.letter;
  document.getElementById("sign").textContent = CONFIG.sign;
  document.getElementById("footer").innerHTML = CONFIG.footer.replace(/\n/g, "<br>");
  const vh = document.getElementById("video-heading");
  if (CONFIG.videoHeading) vh.textContent = CONFIG.videoHeading; else vh.remove();
  if (!CONFIG.video) document.getElementById("videoblock").remove();

  CONFIG.memories.forEach(m => {
    const sec = document.createElement("section");
    sec.className = "vblock vphoto" + (m.photo ? "" : " nophoto");
    if (m.photo) {
      const im = new Image();
      im.src = m.photo; im.alt = m.title; im.className = "bg"; im.draggable = false;
      im.onerror = () => { im.remove(); sec.classList.add("nophoto"); };
      sec.appendChild(im);
    }
    const cap = document.createElement("div");
    cap.className = "cap";
    const capin = document.createElement("div");
    capin.className = "capin";
    const d = document.createElement("div"); d.className = "m-date"; d.textContent = m.date;
    const t = document.createElement("div"); t.className = "m-title"; t.textContent = m.title;
    const x = document.createElement("div"); x.className = "m-text"; x.textContent = m.text;
    capin.append(d, t, x); cap.appendChild(capin); sec.appendChild(cap);
    document.getElementById("greetcard").after(sec);
  });

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => e.target.classList.toggle("inview", e.isIntersecting));
  }, { threshold: 0.35 });
  document.querySelectorAll(".vphoto").forEach(el => io.observe(el));
}

/* ---------- 开场视频：全屏放映，放完自动熄屏进故事 ---------- */
function playOpening() {
  const wrap = document.getElementById("videowrap");
  const v = document.getElementById("openingVideo");
  wrap.hidden = false;
  wrap.style.opacity = "1"; wrap.style.transition = "none";
  v.currentTime = 0;
  v.onended = endOpening;
  v.onerror = () => endOpening();   // 还没上传视频时直接进故事
  v.play().catch(() => endOpening());
}

function skipOpening() { endOpening(); }

function endOpening() {
  const wrap = document.getElementById("videowrap");
  const v = document.getElementById("openingVideo");
  if (wrap.hidden) return;
  if (v) { v.onended = null; v.pause(); }
  window.scrollTo(0, 0);                    // 回到起点（熄屏黑卡）
  wrap.style.transition = "opacity 1.6s ease";
  wrap.style.opacity = "0";                 // 黑幕缓缓化开，露出故事
  setTimeout(() => { wrap.hidden = true; }, 1700);
}

/* 看完想重来：回到最开始，完整再走一遍 */
function replay() {
  const v = document.getElementById("video");
  if (v) v.pause();
  window.scrollTo({ top: 0, behavior: "auto" });
  playOpening();
}

/* 简易彩带 */
function confetti() {
  const c = document.getElementById("confetti"), ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const colors = ["#ffd166","#ef476f","#06d6a0","#118ab2","#f78c6b","#fff"];
  const pieces = Array.from({length: 130}, () => ({
    x: Math.random()*c.width, y: -20 - Math.random()*c.height*.5,
    w: 6+Math.random()*6, h: 8+Math.random()*8,
    vy: 2+Math.random()*3.2, vx: -1.4+Math.random()*2.8,
    rot: Math.random()*Math.PI, vr: -.12+Math.random()*.24,
    color: colors[Math.floor(Math.random()*colors.length)],
  }));
  const t0 = Date.now();
  (function draw() {
    ctx.clearRect(0,0,c.width,c.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if (Date.now()-t0 < 3200) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,c.width,c.height);
  })();
}
</script>
</body>
</html>
