<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎂 有一个礼物等你拆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(160deg, #0f0c29 0%, #302b63 55%, #24243e 100%);
    color: #f5f0ff;
    overflow-x: hidden;
    min-height: 100vh;
  }
  .star {
    position: fixed; border-radius: 50%; background: #fff;
    animation: twinkle var(--d) ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 9; }
  main {
    max-width: 560px; margin: 0 auto; padding: 0 22px 64px;
    min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
  }
  .box { font-size: 84px; cursor: pointer; user-select: none;
    animation: bounce 1.6s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  .hint { margin-top: 28px; font-size: 17px; letter-spacing: 2px; opacity: .85; }
  section { width: 100%; }

  /* ============ 回忆幻灯：缓慢放映 ============ */
  #slideshow {
    position: relative; width: 100%;
    height: 100vh; height: 100dvh;
    overflow: hidden; cursor: pointer;
    touch-action: pan-y;
    user-select: none; -webkit-user-select: none;
  }
  .slide {
    position: absolute; inset: 0; opacity: 0; visibility: hidden;
    transition: opacity 1.4s ease, visibility 1.4s;
  }
  .slide.active { opacity: 1; visibility: visible; }
  .slide img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0; transition: opacity 1.4s ease;
  }
  .slide.active img { opacity: 1; animation: kenburns 10s ease-out forwards; }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.1); } }
  .slide.nophoto {
    background:
      radial-gradient(circle at 78% 18%, rgba(255,209,102,.14), transparent 42%),
      linear-gradient(155deg, #3a2f63 0%, #232a4d 55%, #1a2238 100%);
  }
  .slide .cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 90px 24px 78px; text-align: left;
    background: linear-gradient(180deg, transparent 0%, rgba(8,6,20,.55) 55%, rgba(8,6,20,.9) 100%);
    animation: floaty 5s ease-in-out infinite;
  }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .slide .m-date {
    display: inline-block; font-size: 12px; letter-spacing: 3px;
    color: #ffd166; border: 1px solid rgba(255,209,102,.5);
    border-radius: 999px; padding: 4px 14px; margin-bottom: 12px;
    text-shadow: 0 1px 8px rgba(0,0,0,.6);
  }
  .slide .m-title {
    font-size: 26px; font-weight: 600; letter-spacing: 2px; margin-bottom: 10px;
    text-shadow: 0 2px 14px rgba(0,0,0,.75);
  }
  .slide .m-text {
    font-size: 15px; line-height: 1.9; opacity: .92;
    text-shadow: 0 2px 10px rgba(0,0,0,.8);
  }
  .slide.active .m-date  { animation: rise .9s .5s ease both; }
  .slide.active .m-title { animation: rise .9s .75s ease both; }
  .slide.active .m-text  { animation: rise .9s 1s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
  #dots {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; gap: 7px; z-index: 3;
  }
  #dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,.35); transition: all .4s;
  }
  #dots span.on { background: #ffd166; box-shadow: 0 0 8px rgba(255,209,102,.8); width: 18px; border-radius: 4px; }
  #tapHint {
    position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,.65);
    z-index: 3; transition: opacity .8s; pointer-events: none;
  }

  /* ============ 第一幕：走马灯快闪 ============ */
  #flash {
    position: absolute; inset: 0; z-index: 4;
    background: #000; display: none;
  }
  #flash .f-frame {
    position: absolute; inset: 0; opacity: 0; overflow: hidden;
  }
  #flash .f-frame img { width: 100%; height: 100%; object-fit: cover; }
  #flash .f-frame.nophoto {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 12px;
    background:
      radial-gradient(circle at 70% 20%, rgba(255,209,102,.12), transparent 45%),
      linear-gradient(155deg, #3a2f63 0%, #232a4d 55%, #1a2238 100%);
  }
  #flash .f-date {
    font-size: 13px; letter-spacing: 4px; color: #ffd166;
    border: 1px solid rgba(255,209,102,.5); border-radius: 999px; padding: 4px 16px;
  }
  #flash .f-title { font-size: 34px; font-weight: 600; letter-spacing: 3px; }
  #whiteflash {
    position: absolute; inset: 0; z-index: 5; background: #fff;
    opacity: 0; pointer-events: none;
  }
  /* ============ 第二幕：突然熄屏 ============ */
  #blackout {
    position: absolute; inset: 0; z-index: 6; background: #000;
    opacity: 0; pointer-events: none;
  }
  #blackout .bo-text {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 14px; letter-spacing: 6px; color: rgba(255,255,255,.8);
    opacity: 0; transition: opacity 1.2s ease;
  }
  #skip {
    position: absolute; top: 16px; right: 16px; z-index: 7;
    font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,.75);
    background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.22);
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
    backdrop-filter: blur(4px);
  }
  #replay {
    position: fixed; top: 16px; left: 16px; z-index: 20;
    font-size: 12px; letter-spacing: 2px; color: #ffd166;
    background: rgba(0,0,0,.4); border: 1px solid rgba(255,209,102,.45);
    border-radius: 999px; padding: 7px 16px; cursor: pointer;
    backdrop-filter: blur(4px);
  }

  /* ============ 结尾内容：视频 / 信 / 页脚 ============ */
  #ending { padding-top: 64px; }
  h1 { font-size: 30px; letter-spacing: 3px; line-height: 1.5; }
  .subtitle { margin: 14px 0 40px; font-size: 15px; opacity: .65; letter-spacing: 2px; line-height: 1.9; }
  h2 {
    font-size: 15px; letter-spacing: 6px; opacity: .6; font-weight: normal;
    margin: 64px 0 26px; text-align: center;
  }
  h2::before { content: "· · · "; opacity: .5; }
  h2::after { content: " · · ·"; opacity: .5; }
  video {
    width: 100%; border-radius: 16px; box-shadow: 0 12px 48px rgba(0,0,0,.5);
    background: #000; outline: none;
  }
  .letter {
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px; padding: 28px 22px; text-align: left;
    font-size: 16px; line-height: 2.1; white-space: pre-line; opacity: .95;
  }
  .sign { margin-top: 18px; text-align: right; font-size: 14px; opacity: .6; }
  #footer { margin: 64px 0 0; font-size: 13px; opacity: .5; letter-spacing: 1px; line-height: 2; }
</style>
</head>
<body>
<main>
  <section id="cover">
    <div class="box" onclick="openGift()">🎁</div>
    <p class="hint">点一下，拆开你的礼物</p>
  </section>

  <section id="gift" hidden>
    <div id="slideshow">
      <div id="slides"></div>
      <div id="flash"></div>
      <div id="whiteflash"></div>
      <div id="blackout"><div class="bo-text" id="boText"></div></div>
      <button id="skip" onclick="event.stopPropagation();skipStage()">跳过 ↓</button>
      <div id="dots"></div>
      <div id="tapHint">轻触屏幕 · 翻看下一张回忆</div>
    </div>

    <div id="ending" hidden>
      <h1 id="greeting"></h1>
      <p class="subtitle" id="subtitle"></p>
      <div id="sec-video">
        <h2 id="video-heading"></h2>
        <video id="video" controls playsinline preload="metadata"></video>
      </div>
      <div id="sec-letter">
        <h2>一 封 信</h2>
        <div class="letter"><span id="letter"></span><div class="sign" id="sign"></div></div>
      </div>
      <p id="footer"></p>
    </div>
  </section>
</main>
<canvas id="confetti"></canvas>
<button id="replay" hidden onclick="replay()">↺ 再看一遍</button>
<script>
/* =====================================================================
   想改内容只动 CONFIG：
   · memories = 缓慢放映的一屏一照片；photo 填 "photos/1.jpg"。
   · flashExtra = 只在开场快闪（走马灯）里出现的照片，可放很多张。
   · 节奏参数在下面"开场节奏"处：快闪每张毫秒数、黑屏停留时长。
   · 想让网页跳转别的网址：把 CONFIG 整段换成
       location.replace("https://新网址");
   ===================================================================== */
const CONFIG = {
  name: "亲爱的姐姐",
  title: "三十岁生日快乐！",
  subtitle: "三十而已，未来可期",
  memories: [
    { photo: "", date: "1996", title: "她来啦", text: "出生那年的小故事写在这里——第一次见到这个小家伙的人，都说她将来一定不得了。" },
    { photo: "", date: "年份", title: "小小少年", text: "童年的一张照片配一句话：那时候的她，最爱做的事情是什么？" },
    { photo: "", date: "年份", title: "学生时代", text: "校服、课桌、和好朋友们。挑一张那时候的照片放进来。" },
    { photo: "", date: "年份", title: "长大成人", text: "工作、远方、她一个人扛过的那些事。" },
    { photo: "", date: "这几年", title: "我们的合照", text: "挑一张你们俩的合影，写一句只有你们懂的话。" },
    { photo: "", date: "三十岁", title: "新的开始", text: "最后一张照片，写给三十岁的她：往后都是坦途，生日快乐。" },
  ],
  flashExtra: [],
  blackoutText: "别急 · 我们把时光慢慢放一遍",
  videoHeading: "今 年 的 这 一 章",
  video: "video.mp4",
  letter: [
    "信的第一段写在这里，可以写很多行。",
    "第二段写在这里。",
  ].join("\n"),
  sign: "—— 永远爱你的弟弟",
  footer: "这个网址每年都会更新新的故事\n这张卡片，永远不会过期",
};

/* ---------- 开场节奏（毫秒），想快想慢改这里 ---------- */
const FLASH_MS = 160;        // 走马灯：第一遍每张停留
const FLASH2_MS = 240;       // 走马灯：第二遍每张停留
const WHITE_MS = 90;         // 两遍之间的白闪
const BLACK_HOLD = 1800;     // 熄屏后黑屏停留
const BLACK_FADE = 2000;     // 黑屏淡出回到第一张

/* ---------- 以下是页面逻辑，一般不用动 ---------- */
for (let i = 0; i < 70; i++) {
  const s = document.createElement("span");
  s.className = "star";
  const size = Math.random() * 2.2 + 0.6;
  s.style.cssText = `left:${Math.random()*100}vw;top:${Math.random()*100}vh;` +
    `width:${size}px;height:${size}px;--d:${(Math.random()*3+1.5).toFixed(1)}s;` +
    `animation-delay:${(Math.random()*3).toFixed(1)}s;`;
  document.body.appendChild(s);
}

const stage = { now: "cover" };   // cover | flash | black | slow
let cur = 0, total = 0, timers = [];
let flashK = 0, flashLen = 0, flashManual = false, autoTimer = null;

function openGift() {
  document.getElementById("cover").hidden = true;
  document.getElementById("gift").hidden = false;
  buildSlides();
  confetti();
  startFlash();
}

function buildSlides() {
  const wrap = document.getElementById("slides");
  const dots = document.getElementById("dots");
  CONFIG.memories.forEach(m => {
    const s = document.createElement("div");
    s.className = "slide";
    if (m.photo) {
      const im = new Image();
      im.src = m.photo; im.alt = m.title; im.draggable = false;
      im.onerror = () => { im.remove(); s.classList.add("nophoto"); };
      s.appendChild(im);
    } else s.classList.add("nophoto");
    const cap = document.createElement("div");
    cap.className = "cap";
    const d = document.createElement("div"); d.className = "m-date"; d.textContent = m.date;
    const t = document.createElement("div"); t.className = "m-title"; t.textContent = m.title;
    const x = document.createElement("div"); x.className = "m-text"; x.textContent = m.text;
    cap.append(d, t, x); s.appendChild(cap);
    wrap.appendChild(s);
    dots.appendChild(document.createElement("span"));
  });
  total = CONFIG.memories.length;

  const ss = document.getElementById("slideshow");
  let downX = null;
  ss.addEventListener("pointerdown", e => { if (e.target.id !== "skip") downX = e.clientX; });
  ss.addEventListener("pointerup", e => {
    if (downX === null) return;
    const dx = e.clientX - downX; downX = null;
    if (stage.now === "flash") {           // 快闪阶段：也可手动左右滑一帧帧看
      flashManual = true; clearTimeout(autoTimer);
      if (dx > 50) flashGoto(Math.max(0, flashK - 1));
      else flashGoto(flashK + 1);
      return;
    }
    if (stage.now === "black") { proceedSlow(); return; }   // 熄屏：轻触直接进慢放
    if (stage.now !== "slow") return;
    if (dx > 50) prev();
    else next();
  });
}

/* ---------- 第一幕：走马灯快闪 ---------- */
function startFlash() {
  stage.now = "flash";
  const flash = document.getElementById("flash");
  flash.style.display = "block";
  flash.innerHTML = "";

  // 快闪帧：memories 每条一帧（flashExtra 的照片附加在后面）。
  // 没照片的条目用"年份+标题"文字帧兜底，照片到位后自动变成真照片。
  const seq = CONFIG.memories.map(m => ({ photo: m.photo, date: m.date, title: m.title }));
  (CONFIG.flashExtra || []).forEach(p => seq.push({ photo: p, date: "", title: "" }));

  seq.forEach(f => {
    const frame = document.createElement("div");
    frame.className = "f-frame";
    if (f.photo) {
      const im = new Image();
      im.src = f.photo; im.draggable = false;
      im.onerror = () => {
        frame.classList.add("nophoto");
        im.remove();
        const d = document.createElement("div"); d.className = "f-date";
        const t = document.createElement("div"); t.className = "f-title";
        d.textContent = f.date; t.textContent = f.title;
        frame.append(d, t);
      };
      frame.appendChild(im);
    } else {
      frame.classList.add("nophoto");
      const d = document.createElement("div"); d.className = "f-date";
      const t = document.createElement("div"); t.className = "f-title";
      d.textContent = f.date; t.textContent = f.title;
      frame.append(d, t);
    }
    flash.appendChild(frame);
  });

  flashLen = seq.length;
  flashK = 0; flashManual = false;
  flashGoto(0);
}

/* 快闪虚拟时间轴：0..n-1 第一轮 → n 白闪 → n+1..2n 第二轮 → 结束进熄屏
   自动播放由 autoTimer 驱动；一旦手动滑动就接管（flashManual=true） */
function showFlashFrame(idx) {
  document.querySelectorAll("#flash .f-frame").forEach((x, i) =>
    x.style.opacity = i === idx ? "1" : "0");
}

function flashGoto(k) {
  clearTimeout(autoTimer);
  const wf = document.getElementById("whiteflash");
  const n = flashLen;
  if (k >= 2 * n + 1) { endFlash(); return; }
  flashK = k;
  if (k === n) {                                  // 两轮之间的白闪
    showFlashFrame(-1);
    wf.style.transition = "none"; wf.style.opacity = "0.92";
    if (!flashManual) autoTimer = setTimeout(() => {
      wf.style.transition = "opacity .25s"; wf.style.opacity = "0";
      flashGoto(k + 1);
    }, WHITE_MS + 200);
    return;
  }
  if (k === n + 1) { wf.style.transition = "opacity .25s"; wf.style.opacity = "0"; }
  showFlashFrame(k < n ? k : k - n - 1);
  if (!flashManual) {
    const ms = k < n ? FLASH_MS : FLASH2_MS;
    autoTimer = setTimeout(() => flashGoto(k + 1), ms);
  }
}

/* ---------- 第二幕：突然熄屏 → 第三幕：缓慢放映 ---------- */
function endFlash() {
  clearTimeout(autoTimer);
  timers.forEach(clearTimeout); timers = [];
  const flash = document.getElementById("flash");
  flash.style.display = "none";
  stage.now = "black";
  const bo = document.getElementById("blackout");
  bo.style.display = "block";
  bo.style.transition = "none"; bo.style.opacity = "1";       // 突然熄屏
  const boText = document.getElementById("boText");
  if (CONFIG.blackoutText) {
    boText.textContent = CONFIG.blackoutText;
    timers.push(setTimeout(() => boText.style.opacity = "1", 400));
    timers.push(setTimeout(() => boText.style.opacity = "0", BLACK_HOLD - 500));
  }
  timers.push(setTimeout(proceedSlow, BLACK_HOLD));
}

/* 熄屏后进入缓慢放映（熄屏时轻触屏幕可提前进入） */
function proceedSlow() {
  clearTimeout(autoTimer);
  timers.forEach(clearTimeout); timers = [];
  const bo = document.getElementById("blackout");
  document.getElementById("boText").style.opacity = "0";
  show(0);                                                    // 回到第一张
  bo.style.transition = `opacity ${BLACK_FADE}ms ease`;       // 缓慢淡入放映
  bo.style.opacity = "0";
  stage.now = "slow";
  setTimeout(() => { bo.style.display = "none"; }, BLACK_FADE + 200);
}

function show(i) {
  cur = i;
  document.querySelectorAll("#slides .slide").forEach((el, n) =>
    el.classList.toggle("active", n === i));
  document.querySelectorAll("#dots span").forEach((el, n) =>
    el.classList.toggle("on", n === i));
  document.getElementById("tapHint").style.opacity = i === 0 ? "1" : "0";
}

function next() {
  if (cur < total - 1) show(cur + 1); else finish();
}
function prev() {
  if (cur > 0) show(cur - 1);
}
function skipStage() {
  if (stage.now === "flash" || stage.now === "black") endFlash();
  else if (stage.now === "slow") finish();
}

/* 看完想重来：回到最开始，完整再走一遍 */
function replay() {
  const v = document.getElementById("video");
  if (v) v.pause();
  document.getElementById("ending").hidden = true;
  document.getElementById("replay").hidden = true;
  const ss = document.getElementById("slideshow");
  ss.style.transition = "none"; ss.style.display = "block"; ss.style.opacity = "1";
  window.scrollTo(0, 0);
  startFlash();
}

/* ---------- 结尾 ---------- */
function finish() {
  const ss = document.getElementById("slideshow");
  ss.style.transition = "opacity .9s"; ss.style.opacity = "0";
  setTimeout(() => { ss.style.display = "none"; }, 900);
  const ending = document.getElementById("ending");
  ending.hidden = false;
  document.getElementById("replay").hidden = false;
  document.getElementById("greeting").textContent = CONFIG.name + "，" + CONFIG.title;
  document.getElementById("subtitle").innerHTML = CONFIG.subtitle.replace(/\n/g, "<br>");
  document.getElementById("video").src = CONFIG.video;
  document.getElementById("letter").textContent = CONFIG.letter;
  document.getElementById("sign").textContent = CONFIG.sign;
  document.getElementById("footer").innerHTML = CONFIG.footer.replace(/\n/g, "<br>");
  const vh = document.getElementById("video-heading");
  CONFIG.videoHeading ? vh.textContent = CONFIG.videoHeading : vh.remove();
  if (!CONFIG.video) document.getElementById("sec-video").remove();
  if (!CONFIG.letter.trim()) document.getElementById("sec-letter").remove();
  setTimeout(() => ending.scrollIntoView({ behavior: "smooth" }), 300);
}

/* 简易彩带 */
function confetti() {
  const c = document.getElementById("confetti"), ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const colors = ["#ffd166","#ef476f","#06d6a0","#118ab2","#f78c6b","#fff"];
  const pieces = Array.from({length: 130}, () => ({
    x: Math.random()*c.width, y: -20 - Math.random()*c.height*.5,
    w: 6+Math.random()*6, h: 8+Math.random()*8,
    vy: 2+Math.random()*3.2, vx: -1.4+Math.random()*2.8,
    rot: Math.random()*Math.PI, vr: -.12+Math.random()*.24,
    color: colors[Math.floor(Math.random()*colors.length)],
  }));
  const t0 = Date.now();
  (function draw() {
    ctx.clearRect(0,0,c.width,c.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if (Date.now()-t0 < 3200) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,c.width,c.height);
  })();
}
</script>
</body>
</html>
